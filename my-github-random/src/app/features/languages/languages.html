<div class="language-container">
  <div class="drowdown-header">
    <i class="fa-solid fa-square language-icon"></i>
    <h4>Github Repository Finder</h4>
  </div>

  <div class="drowdown-container" (click)="openListLanguages()">
    <div class="drowdown-selector">
      Select a Language
      <span class="drowdown-arrow">&#9662;</span>
    </div>
    <div class="drowdown-list" hidden>
      <div class="drowdown-item" >Option 1</div>
      <div class="drowdown-item" >Option 2</div>
      <div class="drowdown-item" >Option 3</div>
    </div>
  </div>
</div>
