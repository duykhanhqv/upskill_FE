<div class="language-container">
  <div class="dropdown-header">
    <i class="fa-solid fa-square language-icon"></i>
    <h4>Github Repository Finder</h4>
  </div>

  <div class="dropdown-container" (click)="openListLanguages()">
    <div class="dropdown-selector">
      Select a Language ▼
    </div>
    <ul class="dropdown-list" hidden>
      @for(language of (languagesList | async); track language.value) {
      <li class="dropdown-item" (click)="chooseLanguage(language)">{{language.title}}</li>
      }
    </ul>
  </div>
</div>
