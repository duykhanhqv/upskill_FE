<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Dopamean Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
    <script src="main.js"></script>
    <script
      src="https://kit.fontawesome.com/cebef65839.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="menu-header">
          <div class="header-content">
          <p>Wellcome to Dopamean Studio!</p>

          </div>
        </div>
        <div class="menu-middle">
          <div class="logo">
            <h1>DOPAMEAN</h1>
          </div>

          <div class="search-box">
            <input
              type="text"
              class="search-input"
              placeholder="Search for products, brands and more"
            />
            <button class="search-button">
<i class="fas fa-search"></i>
          </button>
          </div>
          <div class="header-icons">
            <div class="icon">
              <img src="assets/icons/user-icon.png" alt="User Icon" />
            </div>

            <div class="icon">
              <img src="assets/icons/cart-icon.png" alt="Cart Icon" />
            </div>
          </div>
        </div>
        <div class="menu-bottom">
          <ul class="nav-links">
            <li><a href="#">All products</a></li>
            <li><a href="#">New Arrival</a></li>
            <li><a href="#">Tops</a></li>
            <li><a href="#">Bottoms</a></li>
            <li><a href="#">Pants</a></li>
            <li><a href="#">Accessories</a></li>
            <li><a href="#">Sale</a></li>

          </ul>
      </div>
    </header>
    <main>
        <h2>Welcome to Dopamean Studio!</h2>
        <p>Your one-stop shop for all things trendy and stylish.</p>
    </main>
  </body>
</html>
