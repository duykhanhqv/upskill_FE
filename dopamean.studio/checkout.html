<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Checkout Page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
        <script src="main.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/icons-react/dist/index.umd.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
        <script
            src="https://cdn.jsdelivr.net/npm/@tabler/icons@1.74.0/icons-react/dist/index.umd.min.js"></script>
        <script
            src="https://kit.fontawesome.com/cebef65839.js"
            crossorigin="anonymous"></script>
    </head>
    <body>
        <header>
            <div class="header-container">
                <div class="logo">
                    <h1>DOPAMEAN</h1>
                </div>

                <div class="search-box">
                    <i class="ti ti-search"></i>
                    <input
                        type="text"
                        class="search-input"
                        placeholder="Search in products..." />
                </div>

                <div class="header-icons">
                    <div class="icon">
                        <i class="far fa-user"></i>
                    </div>
                    <div class="icon cart-icon">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-badge">2</span>
                    </div>
                </div>
            </div>
        </header>
        <main class="checkout-page">
            <div class="page-title">
                <h1>Checkout</h1>
                <div class="breadcrumb">
                    <a href="index.html">Homepage</a> <span>/</span>
                    <span>Checkout</span>
                </div>
            </div>
            <section class="page-content">
                <div class="checkout-details">
                    <div class="contact-info">
                        <div class="contact-header">
                            <i class="ti ti-user-circle"></i>
                            <h2>CONTACT INFORMATION</h2>
                        </div>
                        <div class="contact-method">
                            <div class="user-input">
                                <label for="phone_number">Phone number</label>
                                <input type="tel" id="phone_number"
                                    name="phone_number"
                                    required />
                            </div>
                            <div class="user-input">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email"
                                    required />
                            </div>

                        </div>

                    </div>
                    <div class="shipping-address">
                        <div class="shipping-header">
                            <i class="ti ti-truck"></i>
                            <h2>SHIPPING METHOD</h2>
                        </div>
                        <div class="shipping-address-form">

                            <label for="full-name">Full Name</label>
                            <input type="text" id="full-name" name="full-name"
                                required />

                            <label for="address">Shipping Address</label>
                            <input type="text" id="address" name="address"
                                required />

                            <label for="city">City/ Province</label>
                            <input type="text" id="city" name="city" required />

                            <label for="district">District</label>
                            <input type="text" id="district"
                                name="district" required />
                        </div>
                    </div>

                </div>
                <div class="order-summary">
                    <h2>Order Summary</h2>
                    <div class="order-items">
                        <div class="order-item">
                            <span>Product 1</span>
                            <span>XL</span>
                            <span>$50.00</span>
                        </div>
                        <div class="order-item">
                            <span>Product 2</span>
                            <span>M</span>
                            <span>$30.00</span>
                        </div>
                    </div>

                    <div class="order-total">
                        <div class="sub-total">
                            <span>Sub-total</span>
                            <span>$75.00</span>
                        </div>
                        <div class="shipping-estimate">
                            <span>Shipping Estimate</span>
                            <span>$5.00</span>
                        </div>
                        <div class="total">
                            <span>Total</span>
                            <span>$80.00</span>
                        </div>
                    </div>
                    <button class="confirm-order">Confirm Order</button>
                </div>
            </section>

        </main>
        <div class="footer">
            <div class="footer-content">
                <p>&copy; 2024 Dopamean Studio. All rights reserved.</p>
            </div>
        </body>
    </html>
